<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#070b14" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free, hands-on IT training — Help Desk, SysAdmin, CompTIA A+, and Scripting & Automation. Lessons, quizzes, in-browser labs, and real support-ticket simulations." />
    <link rel="canonical" href="https://tier-one-tau.vercel.app/" />
    <title>TierOne — Free Hands-On IT Training</title>

    <!-- Default social-preview tags. Overwritten per-route by useSeo()
         (src/shared/lib/seo.ts) once the app hydrates; these are what
         crawlers/scrapers that don't execute JS will see. -->
    <meta property="og:site_name" content="TierOne" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tier-one-tau.vercel.app/" />
    <meta property="og:title" content="TierOne — Free Hands-On IT Training" />
    <meta property="og:description" content="Free, hands-on IT training — Help Desk, SysAdmin, CompTIA A+, and Scripting & Automation. Lessons, quizzes, in-browser labs, and real support-ticket simulations." />
    <meta property="og:image" content="https://tier-one-tau.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TierOne — Free Hands-On IT Training" />
    <meta name="twitter:description" content="Free, hands-on IT training — Help Desk, SysAdmin, CompTIA A+, and Scripting & Automation." />
    <meta name="twitter:image" content="https://tier-one-tau.vercel.app/og-image.png" />

    <!-- Google Fonts: Sora + JetBrains Mono.
         Loaded non-render-blocking (preload -> swap to stylesheet) so the
         hero text can paint immediately in a fallback font instead of the
         browser stalling on this request before first paint. `display=swap`
         then swaps to Sora once it arrives. Weight list trimmed to what's
         actually used in the app (300/light was dead weight; 900/black was
         MISSING despite `font-black` being used — it was silently rendering
         as synthetic-bold 800 until now). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-surface-950 text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
