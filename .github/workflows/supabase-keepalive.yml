name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days with no API activity.
# This pings a harmless, read-only, anon-callable RPC every couple of days so
# the project never goes idle. It performs no writes and touches no user data.
#
# Requires repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       - project URL, e.g. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY   - the anon/publishable key (safe for client use)

on:
  schedule:
    # Every 3 days at 09:00 UTC — comfortably under Supabase's 7-day pause window.
    - cron: '0 9 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call verify_certificate RPC (read-only, no-op lookup)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set."
            exit 1
          fi

          # Defensive cleanup: a pasted-in secret commonly carries a trailing
          # slash, surrounding quotes, or trailing whitespace/newline — any of
          # which makes curl fail with "URL malformed" (exit 3) and, with -s
          # alone, no explanation why. Strip all of that before use.
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]"'"'"']*//' -e 's/[[:space:]"'"'"']*$//' -e 's:/*$::')

          case "$url" in
            https://*) ;;
            *)
              echo "::error::SUPABASE_URL doesn't start with https:// after cleanup — got: '$url'. Check the secret value in Settings -> Secrets and variables -> Actions for stray quotes/whitespace."
              exit 1
              ;;
          esac

          status=$(curl -s -S -o /tmp/resp.json -w '%{http_code}' \
            -X POST "$url/rest/v1/rpc/verify_certificate" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"keepalive-ping-does-not-exist"}')

          echo "HTTP status: $status"
          cat /tmp/resp.json
          echo

          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase keep-alive ping failed with HTTP $status"
            exit 1
          fi
